<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Miraj Jamal Sidik - Informatics Student and Full-Stack Web Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Miraj Jamal Sidik</title>

  <defs>
    <!-- Background gradient: deep navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1b2540"/>
    </linearGradient>

    <!-- Accent gradient: cyan to indigo -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle dot grid pattern for a "tech" feel -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect width="900" height="240" rx="20" fill="url(#bg)"/>
  <rect width="900" height="240" rx="20" fill="url(#grid)"/>

  <!-- Decorative glow behind the badge -->
  <circle cx="130" cy="120" r="95" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Hexagon badge (outer) -->
  <polygon points="130,36 202,78 202,162 130,204 58,162 58,78"
           fill="#0f172a" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Hexagon badge (inner outline) -->
  <polygon points="130,52 188,86 188,154 130,188 72,154 72,86"
           fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Monogram: MJ -->
  <text x="130" y="128" text-anchor="middle"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="1">MJ</text>

  <!-- Code symbol under the monogram -->
  <text x="130" y="166" text-anchor="middle"
        font-family="'Courier New', Consolas, monospace"
        font-size="22" font-weight="700" fill="url(#accent)">&lt;/&gt;</text>

  <!-- Small signal waves on the right of the badge (nod to IoT / networking) -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M222 100 Q232 120 222 140"/>
    <path d="M232 90 Q248 120 232 150" stroke-opacity="0.6"/>
    <path d="M242 80 Q264 120 242 160" stroke-opacity="0.35"/>
  </g>

  <!-- Name -->
  <text x="300" y="116"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="44" font-weight="800" fill="#ffffff">Miraj Jamal Sidik</text>

  <!-- Tagline with blinking cursor -->
  <text x="300" y="154"
        font-family="'Courier New', Consolas, monospace"
        font-size="20" fill="#38bdf8">Informatics Student | Full-Stack Developer<tspan fill="#818cf8"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>

  <!-- Accent underline -->
  <rect x="300" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
